name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Backend (Lint, Build, Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run Prisma migrations on test database
        run: |
          cd server
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_manager_test?schema=public

      - name: Check server formatting & lint
        run: |
          cd server
          npm run lint

      - name: Check server TypeScript build
        run: |
          cd server
          npm run build

      - name: Run server automated test suite
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_manager_test?schema=public
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/lead_manager_test?schema=public
          JWT_SECRET: github-actions-ci-test-jwt-secret-key-12345
          JWT_EXPIRES_IN: 1h

  client:
    name: Frontend (Lint, Typecheck, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Check client formatting & lint
        run: |
          cd client
          npm run lint

      - name: Check client TypeScript & Vite build
        run: |
          cd client
          npm run build
