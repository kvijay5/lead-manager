services:
  - type: web
    name: lead-manager-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lead-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: lead-manager-db
    plan: free
    postgresMajorVersion: 16
